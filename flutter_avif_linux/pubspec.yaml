name: flutter_avif_linux
description: Linux implementation for flutter_avif.
version: 3.1.1
repository: https://github.com/joernto/flutter_avif/tree/main/flutter_avif_linux
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_avif_platform_interface:
    path: ../flutter_avif_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
flutter:
  plugin:
    implements: flutter_avif
    platforms:
      linux:
        pluginClass: FlutterAvifLinuxPlugin
        dartPluginClass: FlutterAvifLinux
